<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Consent Guardian</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" id="connect-card">
        <p class="eyebrow">PARENT DASHBOARD</p>
        <h1>Consent Guardian</h1>
        <p class="muted">A live session appears only after the child approves it on their Android device.</p>
        <div class="auth-grid">
          <label>Email<input id="email" type="email" autocomplete="email" placeholder="parent@example.com" /></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" /></label>
        </div>
        <div class="button-row">
          <button id="signup" class="secondary">Create parent account</button>
          <button id="signin" class="secondary">Sign in</button>
          <button id="signout" class="secondary hidden">Sign out</button>
        </div>
        <p id="auth-status" class="status">Not signed in.</p>
        <label>Session pairing code<input id="room" autocomplete="off" minlength="6" placeholder="shared code" /></label>
        <button id="connect" disabled>Connect as parent</button>
        <p id="status" class="status">Not connected.</p>
      </section>

      <section class="card hidden" id="session-card">
        <div class="toolbar"><div><p class="eyebrow">ACTIVE SESSION</p><h2>Child device</h2></div><button class="danger" id="disconnect">Disconnect</button></div>
        <div class="media-grid">
          <figure><figcaption>Screen</figcaption><video id="screen" autoplay playsinline></video></figure>
          <figure><figcaption>Front camera</figcaption><video id="front-camera" autoplay playsinline></video></figure>
          <figure><figcaption>Back camera</figcaption><video id="back-camera" autoplay playsinline></video></figure>
        </div>
        <p class="muted small">This dashboard does not retain recordings. Ending the child-side session closes the connection.</p>
      </section>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
